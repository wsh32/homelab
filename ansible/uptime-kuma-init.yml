---
# Configure Uptime Kuma on diglett-infra after the infra stack is up.
#
# The uptime-kuma container is deployed by ansible/infra.yml (part of the
# services/diglett-infra compose stack). This playbook creates the admin
# account headlessly and seeds a monitor for every service in network.yml.
#
# Imported by site.yml after infra.yml.
#
# Prerequisites:
#   - uptime_kuma_admin_password set in ansible/secrets.yml (also store it in Vaultwarden)

- name: Initialize Uptime Kuma on diglett-infra
  hosts: diglett-infra
  gather_facts: false

  pre_tasks:
    - name: Load local secrets file if present (ansible/secrets.yml -- gitignored)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"
      failed_when: false

  roles:
    - role: uptime-kuma-init
