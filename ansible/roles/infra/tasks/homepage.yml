---
# Homepage (pokedex) config. Runs after Infisical is healthy: widget API keys are
# read from the machamp-media Infisical project and written to /etc/homepage.env,
# then services.yaml is rendered from network.yml with a widget for each service
# whose key exists. On a fresh rebuild the keys are seeded later by arr-init.yml,
# so widgets appear on the next infra.yml run.

- name: Get Infisical access token for Homepage widget keys
  ansible.builtin.uri:
    url: "http://localhost:8080/api/v1/auth/universal-auth/login"
    method: POST
    body_format: json
    body:
      clientId: "{{ infisical_client_id }}"
      clientSecret: "{{ infisical_client_secret }}"
    status_code: 200
  register: _homepage_inf_login
  no_log: true
  when:
    - (infisical_client_id | default('')) not in ['', 'REPLACE_ME']
    - (infisical_client_secret | default('')) not in ['', 'REPLACE_ME']

- name: Read machamp-media secrets from Infisical
  ansible.builtin.uri:
    url: "http://localhost:8080/api/v3/secrets/raw?workspaceId={{ infisical_project_id }}&environment={{ infisical_environment | default('prod') }}&secretPath=/"
    headers:
      Authorization: "Bearer {{ _homepage_inf_login.json.accessToken }}"
    status_code: 200
  register: _homepage_inf_secrets
  no_log: true
  when: _homepage_inf_login is not skipped

- name: Select Homepage widget API keys
  ansible.builtin.set_fact:
    homepage_secrets: >-
      {{
        (_homepage_inf_secrets.json.secrets | default([]))
        | selectattr('secretKey', 'in', homepage_widgets.values() | map(attribute='secret') | list)
        | rejectattr('secretValue', 'equalto', '')
        | items2dict(key_name='secretKey', value_name='secretValue')
        if _homepage_inf_secrets is not skipped else {}
      }}
  no_log: true

- name: Write Homepage widget keys to /etc/homepage.env
  ansible.builtin.copy:
    dest: /etc/homepage.env
    content: |
      # Generated by Ansible (infra role) from Infisical. Do not edit manually.
      {% for k in homepage_secrets | sort %}
      HOMEPAGE_VAR_{{ k }}={{ homepage_secrets[k] }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  register: _homepage_env

- name: Render Homepage services.yaml and bookmarks.yaml from network.yml
  ansible.builtin.template:
    src: "homepage-{{ item }}.j2"
    dest: "{{ homepage_config_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - services.yaml
    - bookmarks.yaml
  become: true
  register: _homepage_rendered

- name: Copy static Homepage config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../services/diglett-infra/homepage/{{ item }}"
    dest: "{{ homepage_config_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - settings.yaml
    - widgets.yaml
    - custom.js
  become: true
  register: _homepage_static

- name: Recreate Homepage container to apply config changes
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate homepage
    chdir: /home/{{ ansible_user }}/homelab/services/diglett-infra
  become: true
  when: _homepage_env is changed or _homepage_rendered is changed or _homepage_static is changed
