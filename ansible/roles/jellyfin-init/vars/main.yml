---
_svc: "{{ dict(services | default([]) | map(attribute='name') | zip(services | default([]))) }}"
jellyfin_port: "{{ (_svc['jellyfin'] | default({})).port | default(8096) }}"
jellyfin_url: "http://localhost:{{ jellyfin_port }}"
jellyfin_sso_plugin_repo: "K0lin/jellyfin-plugin-sso"
jellyfin_sso_plugin_version: "5.1.1"
